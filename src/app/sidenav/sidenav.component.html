<header class="site-header" (keydown.escape)="closeMenu()"><div class="header-inner">
  <a routerLink="/inicio" class="brand" aria-label="NATOS, inicio"><img src="assets/logonatos.png" alt="" width="66" height="40"><span class="brand-caption">COMERCIALIZADORA</span></a>
  <button #menuButton type="button" class="menu-toggle" [attr.aria-expanded]="menuOpen()" aria-controls="public-navigation" (click)="menuOpen.set(!menuOpen())">{{ menuOpen() ? 'Cerrar' : 'Menú' }} <span aria-hidden="true">{{ menuOpen() ? '×' : '☰' }}</span></button>
  <nav id="public-navigation" class="public-navigation" [class.open]="menuOpen()" aria-label="Navegación principal">
    <a routerLink="/inicio" routerLinkActive="active" ariaCurrentWhenActive="page">Inicio</a><a routerLink="/catalogo" routerLinkActive="active" ariaCurrentWhenActive="page">Catálogo</a><a routerLink="/nosotros" routerLinkActive="active" ariaCurrentWhenActive="page">Nosotros</a><a routerLink="/contacto" routerLinkActive="active" ariaCurrentWhenActive="page">Contacto</a>
    <a class="staff-link" [routerLink]="auth.loggedIn() ? '/admin/pedidos' : '/acceso'">{{ auth.loggedIn() ? 'Mi espacio de trabajo' : 'Acceso del personal' }} <span aria-hidden="true">↗</span></a>
  </nav>
  <a class="cart-link" routerLink="/carrito" routerLinkActive="active" [attr.aria-label]="'Carrito, ' + cart.count() + ' paquetes'"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 3h2l2.5 12h11l2-8H6"/><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/></svg><span class="cart-text">Carrito</span><span class="cart-count">{{ cart.count() }}</span></a>
</div></header>
